name: garimpo

# One knob for the Ollama CPUs. Ollama does not read the cgroup limit: it sizes its thread
# pool from the host CPUs, so every request must send num_thread with the same number.
x-ollama-cpus: &ollama-cpus ${OLLAMA_CPUS:-4}

services:
  dev: &dev
    build:
      context: .
      dockerfile: docker/dev.Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /src
    environment:
      GARIMPO_OLLAMA_URL: http://ollama:11434
      GARIMPO_OLLAMA_NUM_THREAD: *ollama-cpus
    volumes:
      - .:/src
      - go-mod:/go/pkg/mod
      - go-build:/home/dev/.cache/go-build
    init: true
    command: sleep infinity

  # Labs that need a CPU limit (compose run has no --cpus flag):
  #   docker compose run --rm lab go run ./labs/maxprocs
  #   LAB_CPUS=4 docker compose run --rm lab go run ./labs/maxprocs
  lab:
    <<: *dev
    profiles: [labs]
    cpus: ${LAB_CPUS:-2}
    command: go version

  # Benchmarks pin two CPUs (cpuset) instead of a CPU quota, so the host does not move them
  # around or throttle them in the middle of a run:
  #   docker compose run --rm bench go test -run '^$' -bench . -count 10 ./labs/goroutine-cost
  bench:
    <<: *dev
    profiles: [labs]
    cpuset: ${BENCH_CPUSET:-2,4}
    command: go version

  ollama:
    image: ollama/ollama:0.40.16
    cpus: *ollama-cpus
    environment:
      OLLAMA_NUM_PARALLEL: 4
      OLLAMA_KEEP_ALIVE: 30m
    # No published ports: the dev container reaches it at http://ollama:11434.
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  go-mod:
  go-build:
  ollama-models:
